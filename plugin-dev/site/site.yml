# Config for the site builder (scripts/build_site.py).

workflows_order: [new-plugin]
workflow_skills_order: [new-plugin]

# The flow page (site/flow.md) is drawn from this block. The `flow` claim in contracts.yml
# holds it to the files it names.
flow:
  roles:
    - {id: new-plugin, note: driver}

  documents:
    - name: the purpose
      path: PURPOSE.md
      writes: [new-plugin]
      reads: [session_start.py]

  drivers:
    - skill: new-plugin
      ledger: "`PURPOSE.md`, once you approve it"
      next: the skill's own steps
      writer: "`new_plugin.py`"
      writer_in: driver
      held: nothing

  hooks:
    - script: session_start.py
      event: SessionStart
      does: prints the protocol and each plugin's `PURPOSE.md`
    - script: on_edit.py
      event: PostToolUse
      does: fails a definition over its word limit back to the model
    - script: on_stop.py
      event: Stop
      does: runs the whole check for each plugin the session edited
