[project]
name = "minilab"
version = "0.1.0"
description = "Daily prices to returns, rolling volatility and a risk report"
requires-python = ">=3.10"

[tool.pytest.ini_options]
pythonpath = ["packages/mdata/src", "packages/risk/src"]
testpaths = ["tests"]
addopts = "-p no:cacheprovider --import-mode=importlib"
markers = ["intent: written by the tester from the task's acceptance and golden cases"]
