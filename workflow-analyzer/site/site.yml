# Config for the site builder (plugin-dev/scripts/build_site.py). Every key is optional.

# The flow page (site/flow.md) is drawn from this block. The `flow` claim in contracts.yml
# holds it to the files it names.
flow:
  roles:
    - ask-run
    - run-reader

  uses:
    ask-run:
      names: [run-flow]

  documents:
    - name: a built run
      path: index.json
      match: ["workspace", "index.json"]
      writes: [trace.py]
      reads: [ask-run, run-reader]
