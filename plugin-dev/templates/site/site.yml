# Config for the site builder (plugin-dev/scripts/build_site.py). Every key is optional.

# H1 of the home page. Default: the plugin's name.
# site_title: <name>

# Reading order for site/workflows/, site/reference/ and the workflow skills. A file not
# listed follows alphabetically, so a new page needs no edit here.
# workflows_order: [first-page]
# reference_order: [the-states]
# workflow_skills_order: [first-skill]

# Extra files rendered as code pages under "Rules and config".
# config_files: [defaults.toml]

# The flow page (site/flow.md) is drawn from this block and the agents' frontmatter. The
# build-site skill's references/flow.md has every field. Once the block exists, declare a
# `flow` claim in contracts.yml, which holds it to the files.
# flow:
#   roles:                    # left to right in the charts. Default: every agent
#     - {id: my-workflow, note: driver}
#     - my-agent
#   uses:                     # beyond what an agent's `skills:` frontmatter preloads
#     my-agent:
#       sometimes:
#         - my-skill: when it applies
#   documents:
#     - name: the ledger
#       path: runs/{slug}/ledger.jsonl
#       writes: [run.py]
#       reads: [my-workflow]
#   drivers:
#     - skill: my-workflow
#       ledger: "`runs/{slug}/ledger.jsonl`"
#       next: "`run.py next`"
#       spawns: one my-agent per step
#       returns: "Result: done | question | blocked"
#       writer: "`run.py record`"
#       writer_in: driver
#       held: "nothing: `run.py record` refuses a step that is not whole"
