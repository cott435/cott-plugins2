# The claims this plugin makes about itself, run by plugin-dev's scripts/check.py.

forbid:
  - name: no unprefixed plugin command is typeable
    # A plugin skill is typed /workflow-analyzer:<name>; a bare /<name> is a command nobody can run.
    pattern: '(^|[\s"(\[`])/(?!reload-plugins|[a-z][a-z0-9-]*:)(?:[a-z][a-z0-9]*-[a-z0-9-]+)\b'
    files: ['skills/**/*.md', 'agents/*.md', 'README.md', 'PURPOSE.md']

flow:
  - name: the flow page agrees with the files
    file: site/site.yml
