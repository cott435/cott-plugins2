# Multi-package: packages/{{pkg}}/pyproject.toml. Dependencies only, plus deptry for this
# package; shared tool config is in the root pyproject.toml.
[project]
name = "{{pkg_dist}}"
version = "0.1.0"
requires-python = ">={{python_version}}"
dependencies = [
{{dependencies}}
]

[build-system]
requires = ["{{uv_build_requirement}}"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "{{pkg}}"

{{package_sources}}

# references/ is excluded as in the root config (CR-08); deptry runs from this folder, so the
# root references/ folder is outside its scan anyway.
[tool.deptry]
known_first_party = ["{{pkg}}"]
extend_exclude = ["references"]
{{deptry_ignores}}
