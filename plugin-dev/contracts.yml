# The claims this plugin makes about itself, run by scripts/check.py.

forbid:
  - name: no unprefixed plugin command is typeable
    # A plugin skill is typed /plugin-dev:<name>; a bare /<name> is a command nobody can run.
    pattern: '(^|[\s"(\[`])/(?!reload-plugins|[a-z][a-z0-9-]*:)(?:[a-z][a-z0-9]*-[a-z0-9-]+)\b'
    files: ['skills/**/*.md', 'README.md', 'PURPOSE.md', 'protocol.md']

  - name: no definition narrates its own history
    # protocol.md, Definitions stay small. The changelog holds what changed.
    pattern: '(?i)\b(previously|formerly|no longer|as of v?\d|used to)\b'
    files: ['skills/**/*.md', 'agents/*.md', 'protocol.md']
    unless: ['no "previously"', 'used to allow']

  - name: no script reads a harness's environment
    # Scripts know no harness, so a plugin can move to another one. Hooks are the adapters.
    pattern: '\b(CLAUDE|CODEX|GEMINI|GROK)_[A-Z_]+'
    files: ['scripts/*.py', 'skills/**/*.py']

headings:
  - name: new-plugin asks for the sections the PURPOSE template defines
    owner: templates/PURPOSE.md
    readers:
      - file: skills/new-plugin/SKILL.md
        cites: ['Goal', 'Who uses it, and when', 'What it does', 'Non-goals', 'Done well means']

names_listed:
  - name: the README names every skill
    dirs: 'skills/*'
    file: README.md
    span: ['| `skills/`', "\n"]

flow:
  - name: the flow page agrees with the files
    file: site/site.yml
